carla_lane_following:
  env:
    world:
      carla_port: 20000
      town: "Town01" # , "Town05" , "Town04]" # which town to simulate
      background_speed: 25
      actor_active_distance: 100
      fixed_delta_seconds: 0.1
      auto_lane_change: False
      traffic:
        tm_seed: 2024

    name: CarlaLaneFollowingEnv-v0

    action:
      discrete: True 
    # discrete accelerations (throttle) -- add full throttle option for better control authority
    discrete_acc: [0.5, 0.7]  # discrete value of accelerations (throttle)
    discrete_steer: [-0.3, 0.0, 0.3] # discrete value of steering angles
    n_commands: 3 # number of text commands
    continuous_acc: [0.0, 1.0]
    continuous_steer: [-0.8, 0.8]

    observation.enabled: [semantic_segmentation , collision , lane_invasion, lane_invasion_raw]
    
    num_vehicles: 0

    reward:
      # desired_speed is in meters/second (m/s). 25 m/s ~= 90 km/h.
      desired_speed: 25 # desired speed (m/s)
      scales:
        {
          waypoint: 2.0,
          speed: 2.0,
          collision: 30.0,
          out_of_lane: 3.0,
          time: 20.0,
          destination_reached: 100.0,
        }

    max_distance: 5.0  # meters
    min_speed_mps: 0.5 # m/s
    min_speed_timeout: 10.0   # seconds
    max_speed_kmh: 100

    terminal:
      time_limit: 1000 # maximum timesteps per episode
      out_lane_thres: 3 # threshold for out of lane

    display:
      render_keys: [semantic_segmentation]

  dreamerv2:
    encoder.cnn_keys: "semantic_segmentation"
    decoder.cnn_keys: "semantic_segmentation"
    decoder.cnn_kernels: [5, 5, 5, 6, 6]
    train.log_keys_video: [semantic_segmentation]

  dreamerv3:
    encoder.cnn_keys: "semantic_segmentation"
    decoder.cnn_keys: "semantic_segmentation"
    run.log_keys_video: [semantic_segmentation]

