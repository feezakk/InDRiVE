carla_train:
  env:
    world: { town: Town01, fixed_delta_seconds: 0.1 }
    name: CarlaTrainEnv-v0
    stage: pretrain          # override per run
    seed: 101
    # Stage/town pools (indices refer to the arrays above)
    route_pools:
      Town01:
        pretrain: [0,1,2]
        finetune: [0,2]
        calib:    [1]

    observation.enabled: [semantic_segmentation , collision , lane_invasion]
    <<: *carla_wpt
    # Optional: inline route tables; else class defaults are used
    lane_start_points: [[113.88,199.41,0.0], [334.19,219.50,0.0], [391.86,303.89,0.0]]
    lane_end_points:   [[293.48,199.41,0.0], [334.19,307.18,0.0], [366.13,325.66,0.0]]

    num_vehicles: 10
    use_road_waypoints: [True, False]
    
    

  dreamerv2:
    encoder.cnn_keys: "semantic_segmentation"
