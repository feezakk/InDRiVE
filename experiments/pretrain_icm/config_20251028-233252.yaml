dreamerv2:
  decoder:
    cnn_kernels: [5, 5, 5, 6, 6]
    cnn_keys: semantic_segmentation
  encoder: {cnn_keys: semantic_segmentation}
  train:
    log_keys_video: [semantic_segmentation]
dreamerv3:
  actent: 0.0003
  actor:
    act: silu
    fan: avg
    inputs: [deter, stoch]
    layers: 2
    maxstd: 1.0
    minstd: 0.1
    norm: layer
    outnorm: false
    outscale: 1.0
    symlog_inputs: false
    unimix: 0.01
    units: 512
    winit: normal
  actor_dist_cont: normal
  actor_dist_disc: onehot
  actor_grad_cont: backprop
  actor_grad_disc: reinforce
  actor_opt: {clip: 100.0, eps: 1e-05, lateclip: 0.0, lr: 3e-05, opt: adam, warmup: 0,
    wd: 0.0}
  batch_length: 64
  batch_size: 16
  collision_head:
    act: silu
    dist: binary
    fan: avg
    inputs: [deter, stoch]
    layers: 2
    norm: layer
    outnorm: false
    outscale: 1.0
    units: 512
    winit: normal
  cont_head:
    act: silu
    dist: binary
    fan: avg
    inputs: [deter, stoch]
    layers: 2
    norm: layer
    outnorm: false
    outscale: 1.0
    units: 512
    winit: normal
  critic:
    act: silu
    bins: 255
    dist: symlog_disc
    fan: avg
    inputs: [deter, stoch]
    layers: 2
    norm: layer
    outnorm: false
    outscale: 0.0
    symlog_inputs: false
    units: 512
    winit: normal
  critic_opt: {clip: 100.0, eps: 1e-05, lateclip: 0.0, lr: 3e-05, opt: adam, warmup: 0,
    wd: 0.0}
  critic_slowreg: logprob
  critic_type: vfunction
  data_loaders: 8
  decoder:
    act: silu
    cnn: resnet
    cnn_blocks: 0
    cnn_depth: 32
    cnn_keys: semantic_segmentation
    cnn_sigmoid: false
    fan: avg
    image_dist: mse
    inputs: [deter, stoch]
    minres: 4
    mlp_keys: none
    mlp_layers: 5
    mlp_units: 1024
    norm: layer
    outscale: 1.0
    resize: stride
    vector_dist: symlog_mse
    winit: normal
  disag_head:
    act: silu
    dist: mse
    fan: avg
    inputs: [deter, stoch, action]
    layers: 2
    norm: layer
    outscale: 1.0
    units: 512
    winit: normal
  disag_models: 8
  disag_target: [stoch]
  dyn_loss: {free: 1.0, impl: kl}
  encoder: {act: silu, cnn: resnet, cnn_blocks: 0, cnn_depth: 32, cnn_keys: semantic_segmentation,
    fan: avg, minres: 4, mlp_keys: none, mlp_layers: 2, mlp_units: 16, norm: layer,
    resize: stride, symlog_inputs: true, winit: normal}
  envs: {amount: 1, length: 0, parallel: process, reset: true}
  eval_dir: ''
  expl_behavior: Explore
  expl_opt: {clip: 100.0, eps: 1e-05, lr: 0.0001, opt: adam, warmup: 0, wd: 0.0}
  expl_rewards: {disag: 0.0, extr: 0.0, icm: 1.0, rnd: 0.0}
  filter: .*
  forward_units: 512
  grad_heads: [decoder, reward, cont]
  horizon: 333
  icm_beta: 0.8
  icm_head: {act: silu, dist: mse, fan: avg, layers: 2, norm: layer, outscale: 1.0,
    units: 512, winit: normal}
  icm_norm: {decay: 0.99, eps: 1e-08}
  icm_opt: {eps: 1e-08, lr: 0.0001, opt: adam}
  imag_horizon: 15
  imag_unroll: false
  inverse_units: 512
  jax:
    debug: false
    debug_nans: false
    jit: true
    logical_cpus: 0
    metrics_every: 10
    platform: gpu
    policy_devices: [0]
    prealloc: false
    precision: float16
    train_devices: [0]
  logdir: ./experiments/pretrain_icm_barrier_log_calib
  loss_scales: {actor: 1.0, collision: 1.0, cont: 1.0, critic: 1.0, dyn: 0.5, image: 1.0,
    offlane: 1.0, rep: 0.1, reward: 1.0, slowreg: 1.0, vector: 1.0}
  method: name
  model_opt: {clip: 1000.0, eps: 1e-08, lateclip: 0.0, lr: 0.0001, opt: adam, warmup: 0,
    wd: 0.0}
  offlane_head:
    act: silu
    dist: binary
    fan: avg
    inputs: [deter, stoch]
    layers: 2
    norm: layer
    outnorm: false
    outscale: 1.0
    units: 512
    winit: normal
  rep_loss: {free: 1.0, impl: kl}
  replay: uniform
  replay_hyper: {alpha: 0.7, beta: 0.7, c: 10000.0, epsilon: 0.01, initial_priority: 100000.0,
    key_find_priority: 10000000.0}
  replay_online: false
  replay_size: 100000000.0
  retnorm: {decay: 0.99, impl: perc_ema, max: 1.0, perchi: 95.0, perclo: 5.0}
  return_lambda: 0.95
  reward_head:
    act: silu
    bins: 255
    dist: symlog_disc
    fan: avg
    inputs: [deter, stoch]
    layers: 2
    norm: layer
    outnorm: false
    outscale: 0.0
    units: 512
    winit: normal
  rnd_feat_dim: 512
  rnd_head: {act: silu, dist: mse, fan: avg, layers: 2, norm: layer, outscale: 1.0,
    units: 512, winit: normal}
  rnd_norm: {decay: 0.99, eps: 1e-08}
  rnd_opt: {eps: 1e-08, lr: 0.0001, opt: adam}
  rssm: {act: silu, action_clip: 1.0, classes: 32, deter: 512, fan: avg, initial: learned,
    norm: layer, stoch: 32, unimix: 0.01, units: 512, unroll: false, winit: normal}
  run:
    eval_eps: 1
    eval_every: 10000.0
    eval_fill: 0
    eval_initial: true
    eval_samples: 1
    expl_until: 500000
    from_checkpoint: ''
    log_every: 10000
    log_keys_max: ^$
    log_keys_mean: ^(ext_reward_step)$
    log_keys_sum: ^(ext_reward_step)$
    log_keys_video: [semantic_segmentation]
    log_per_step: false
    log_zeros: false
    save_every: 2000
    script: train
    steps: 500000
    sync_every: 10
    train_fill: 0
    train_ratio: 512
  safe_eval:
    agg: discounted
    alpha: 0.05
    beta: 0.15
    calibrator_path: ''
    enable: true
    enforce: false
    fallback: dynamic
    grid: {n_acc: 2, n_steer: 3}
    horizon: 3
    mode: long
    rel_radius: 0.2
    rel_w: 0.05
    tau: 0.5
  safe_train: {enable: false, gamma: 0.99, horizon: 6, lam: 0.25, mix_collision: 0.5,
    mode: one_step}
  seed: 0
  shield_penalty: 0.1
  shield_thresh: 0.3
  slow_critic_fraction: 0.02
  slow_critic_update: 1
  task: dummy_disc
  task_behavior: Greedy
  wrapper: {checks: false, discretize: 0, length: 0, reset: true}
env:
  action:
    continuous_acc: [-3.0, 3.0]
    continuous_steer: [-1.0, 1.0]
    discrete: true
    discrete_acc: [0.2, 0.3]
    discrete_steer: [-0.3, 0.0, 0.3]
    n_commands: 3
  display: {backend: pygame, enable: true}
  eval: false
  lane_end_points:
  - [293.48, 199.41, 0.0]
  - [334.19, 307.18, 0.0]
  - [366.13, 325.66, 0.0]
  lane_start_points:
  - [113.88, 199.41, 0.0]
  - [334.19, 219.5, 0.0]
  - [391.86, 303.89, 0.0]
  name: CarlaTrainEnv-v0
  num_vehicles: 10
  observation:
    birdeye_gt:
      color_by_obs: true
      ego_offset: 12
      entities: [roadmap, waypoints, background_waypoints, fov_lines, ego_vehicle,
        background_vehicles]
      extend_wpt: false
      handler: birdeye
      key: birdeye_gt
      obs_range: 32
      observability: full
      shape: [128, 128, 3]
      sight_fov: 150
      sight_range: 32
      waypoint_obs: visible
    birdeye_raw:
      color_by_obs: false
      ego_offset: 12
      entities: [roadmap, waypoints, ego_vehicle, background_vehicles]
      extend_wpt: false
      handler: birdeye
      key: birdeye_raw
      obs_range: 32
      observability: full
      shape: [128, 128, 3]
      sight_fov: 150
      sight_range: 32
      waypoint_obs: visible
    birdeye_with_traffic_lights:
      color_by_obs: false
      ego_offset: 12
      entities: [roadmap, waypoints, background_waypoints, ego_vehicle, background_vehicles,
        traffic_lights, stop_signs]
      extend_wpt: false
      handler: birdeye
      key: birdeye_with_traffic_lights
      obs_range: 32
      observability: full
      shape: [128, 128, 3]
      sight_fov: 150
      sight_range: 32
      waypoint_obs: visible
    birdeye_wpt:
      color_by_obs: false
      ego_offset: 12
      entities: [roadmap, waypoints, background_waypoints, ego_vehicle, background_vehicles]
      extend_wpt: false
      handler: birdeye
      key: birdeye_wpt
      obs_range: 32
      observability: full
      shape: [128, 128, 3]
      sight_fov: 150
      sight_range: 32
      waypoint_obs: visible
    birdeye_wpt_with_errors:
      color_by_obs: false
      ego_offset: 12
      entities: [roadmap, waypoints, error_background_waypoints, ego_vehicle, background_vehicles]
      error_rate: 0.2
      extend_wpt: false
      handler: birdeye
      key: birdeye_wpt_with_errors
      obs_range: 32
      observability: full
      shape: [128, 128, 3]
      sight_fov: 150
      sight_range: 32
      waypoint_obs: visible
    camera:
      attributes: {fov: 120.0, image_size_x: 128, image_size_y: 128, sensor_tick: 0.1}
      blueprint: sensor.camera.rgb
      handler: camera
      key: camera
      shape: [128, 128, 3]
      transform: {x: 1.5, z: 2.0}
    collision:
      blueprint: sensor.other.collision
      handler: collision
      key: collision
      shape: [1]
    enabled: [semantic_segmentation, collision, lane_invasion]
    lane_invasion:
      blueprint: sensor.other.lane_invasion
      handler: lane_invasion
      key: lane_invasion
      shape: [1]
    lane_invasion_raw:
      blueprint: sensor.other.lane_invasion
      handler: lane_invasion
      key: lane_invasion
      shape: [1]
    lidar:
      attributes: {channels: 32, range: 32, sensor_tick: 0.1}
      blueprint: sensor.lidar.ray_cast
      ego_offset: 12
      handler: lidar
      key: lidar
      lidar_bin: 0.25
      shape: [128, 128, 3]
      transform: {z: 2.1}
    semantic_segmentation:
      attributes: {fov: 120.0, image_size_x: 128, image_size_y: 128, sensor_tick: 0.1}
      blueprint: sensor.camera.semantic_segmentation
      handler: semantic_segmentation
      key: semantic_segmentation
      shape: [128, 128, 3]
      transform: {x: 1.5, z: 2.0}
    spectator:
      fov: 90
      handler: spectator
      height: 40
      key: spectator
      pitch: -90
      sensor_tick: 0.1
      shape: [512, 512, 3]
  reward:
    desired_speed: 4
    scales: {collision: 30.0, destination_reached: 20.0, out_of_lane: 3.0, speed: 0.5,
      time: 0.0, waypoint: 2.0}
  route_pools:
    Town01:
      calib: [1]
      finetune: [0, 2]
      pretrain: [0, 1, 2]
  seed: 101
  stage: pretrain
  terminal: {min_speed: 0.3, off_road_dist_thres: 1.0, out_lane_thres: 1.0, slow_grace_steps: 5,
    time_limit: 500, too_slow_duration: 10, wrong_dir_angle_deg: 120.0, wrong_dir_duration: 1,
    wrong_dir_min_speed: 0.5}
  use_road_waypoints: [true, false]
  world:
    actor_active_distance: 100
    auto_lane_change: true
    carla_port: 2000
    fixed_delta_seconds: 0.1
    tm_port_offset: 5000
    town: Town01
    traffic: {tm_seed: 2024}
